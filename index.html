    return `<section class="screen focus-screen workout-queue-shell">${state.cancelArmed?`<div class="cancel-confirm card"><div><b>End this block?</b><small>Logged work stays in history.</small></div><div><button class="ghost" data-action="cancel-disarm">Keep going</button><button class="danger-button" data-action="cancel-workout">End</button></div></div>`:''}<div class="focus-top"><button class="icon-btn" data-action="cancel-arm">×</button><div class="session-progress"><span>${esc(s.dayLabel)} · ${idx}/${s.exercises.length}</span><i><b style="width:${progress}%"></b></i></div><span class="timer-chip">${durationLabel(s.durationMode||'full')} · SET ${setNo}/${p.sets}</span></div><article class="queue-stage now"><div class="queue-label"><span>NOW</span><span>${setNo}/${p.sets}</span></div><h2 class="queue-now-name">${esc(exerciseName(wx.exerciseId,profile))}</h2><div class="queue-target">${esc(target)}<small>${esc(p.reason||'Follow the planned target.')}</small></div>${(p.restLearned||p.learnedSubstitutedFrom||p.performanceConfidence==='pattern_adjusted'||p.performanceConfidence==='conservative')?`<span class="learned-badge">LEARNED FROM YOUR HISTORY</span>`:''}${p.skillName?`<span class="skill-badge">${esc(p.skillName.toUpperCase())} · NEXT ${esc(p.skillMilestone||'clean reps')}</span>`:''}<button class="primary wide huge-done" data-action="done-prescribed-set">DONE ${metric==='run'?'RUN':'SET'}</button>${metric==='run'?`<button class="ghost wide run-actual-toggle" data-action="show-run-actual">${state.runActual?'Hide actual run':'Log actual distance + time'}</button>${state.runActual?`<div class="run-actual-panel"><label><span>Distance km</span><input id="runActualDistance" type="number" step="0.01" value="${p.distanceKm||1.5}"></label><label><span>Duration min</span><input id="runActualMinutes" type="number" step="0.1" value="${p.prescribedMinutes||10}"></label><button class="primary wide" data-action="log-run-actual">SAVE ACTUAL RUN</button></div>`:''}`:''}</artic   async function renderCoach(){const [c,history]=await Promise.all([coachDashboard(),coachDecisionHistory()]);if(!c.latestReview)return `<section class="screen coach-screen"><div class="screen-head"><div><span class="kicker">WEEKLY COACH</span><h2>One decision. Clear reasons.</h2></div></div><article class="card coach-empty"><span class="kicker">FIRST REVIEW</span><p>Coach uses weight trend, food execution, training and persistent fatigue signals. Missing data means HOLD.</p><button class="primary" data-action="generate-review">Generate review</button></article></section>`;const d=c.latestDecision,m=c.latestReview.metricsSnapshot||{},f=m.fatigue||{signals:[],activeSignalCount:0,why:''};return `<section class="screen coach-screen"><div class="screen-head"><div><span class="kicker">WEEKLY COACH · V5.7</span><h2>Review · ${fmtDate(c.latestReview.generatedAt)}</h2></div><span class="pill">${esc(d?.confidence||'—')}</span></div><article class="card coach-week"><span class="kicker">THIS WEEK · ${esc(c.latestReview.windowEnd||'')}</span><h3>What actually happened</h3>${renderWeeklyEvidence(m.weekly)}</article><article class="card coach-decision ${esc(d?.status||'')}"><span class="kicker">ONE CHANGE</span><h2>${esc(d?.title||'Hold')}</h2><p>${esc(d?.why||'No change is justified yet.')}</p><div class="coach-evidence">${coachDecisionEvidence(d).map(([label,value])=>`<div><span>${esc(label)}</span><b>${esc(value)}</b></div>`).join('')}</div><small class="coach-status">${d?.status==='accepted'?'Applied automatically · see Decision History below':d?.status==='observed'?'No system change was needed':esc(d?.status||'')}</small>${d?.status==='proposed'?`<div class="coach-actions"><button class="primary" data-action="decision" data-id="${esc(d.id)}" data-status="accepted">Accept</button><button class="ghost" data-action="decision" data-id="${esc(d.id)}" data-status="rejected">Keep current plan</button></div>`:''}</article>${c.recovery?`<article class="card recovery-live"><span class="kicker">RECOVERY WEEK ACTIVE</span><h3>Reduced work</h3><p>Active until ${fmtDate(c.recovery.endsAt)}.</p></article>`:''}<article class="card coach-history"><span class="kicker">DECISION HISTORY</span><h3>Why did it change?</h3>${history.length?history.map(x=>`<details><summary><b>${esc(x.title)}</b><small>${esc(x.at?fmtDate(x.at):'Current plan')}</small></summary>${x.before!=null&&x.after!=null?`<p class="coach-shift">${esc(String(x.before))} → ${esc(String(x.after))} ${esc(x.unit)}</p>`:''}<p>${esc(x.why)}</p><div class="coach-evidence">${x.evidence.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(String(v))}</b></div>`).join('')}</div></details>`).join(''):'<p class="coach-empty-inline">No changes or decisions recorded yet.</p>'}</article><article class="card fatigue-card"><div class="section-title"><div><span class="kicker">RECOVERY GATE</span><h3>Persistent signals only</h3></div><b>${f.recoveryWeekCandidate?'CANDIDATE':'HOLD'}</b></div><p>${esc(f.why||'Need more data.')}</p></article><article class="card review-footer"><div><span class="kicker">NEXT REVIEW</span><p>${c.canGenerate?'Ready now':`${c.daysUntilNextReview} day(s)`}</p></div>${c.canGenerate?'<button class="ghost" data-action="generate-review">Generate new review</button>':'<small>Reviews are rate-limited to one per week.</small>'}</article></section>`}

  async function renderCloud(){const app=qs('#app'),cfg=await cloudConfig(),sess=await cloudSession(),out=await all('outbox'),last=await metaGet('cloud.lastSync');app.innerHTML=`<div class="modal-backdrop"><section class="card cloud-panel"><div class="screen-head"><div><span class="kicker">OPTIONAL CLOUD</span><h2>Local first. Sync second.</h2></div><button class="icon-btn" data-action="cloud-close">×</button></div><div class="sync-stats"><div><span>PENDING</span><strong>${out.filter(x=>x.state==='pending').length}</strong></div><div><span>FAILED</span><strong>${out.filter(x=>x.state==='failed').length}</strong></div><div><span>LAST SYNC</span><strong>${last?fmtDate(last):'Never'}</strong></div></div>${sess?`<div class="signed-in"><b>${esc(sess.email||'Signed in')}</b><small>${navigator.onLine?'Online':'Offline — changes stay local'}</small></div><button class="primary wide" data-action="sync-now">Sync now</button><button class="ghost wide" style="margin-top:8px" data-action="cloud-signout">Sign out locally</button>`:`<label class="cloud-field"><span>Supabase URL</span><input id="cloudUrl" value="${esc(cfg?.url||'')}"></label><label class="cloud-field"><span>Publishable key</span><input id="cloudKey" value="${esc(cfg?.publishableKey||'')}"></label><button class="ghost wide" data-action="cloud-save">Save cloud settings</button><hr class="hairline"><label class="cloud-field"><span>Email</span><input id="cloudEmail" type="email"></label><label class="cloud-field"><span>Password</span><input id="cloudPass" type="password"></label><div class="cloud-actions"><button class="primary" data-action="cloud-auth" data-mode="signin">Sign in</button><button class="ghost" data-action="cloud-auth" data-mode="signup">Create account</button></div>`}<p class="cloud-note">Uses the same <code>sync_entities</code> envelope/RLS model as the modular V2. Photos remain local unless a future explicit backup feature is enabled.</p></section></div>`;bind()}


  // V6.0 onboarding applies only to a profile first created by this build.

  function onboardingTomorrow(schedule){const dk=addDays(dateKey(),1),weekday=(new Date(dk+'T12:00:00').getDay()+6)%7,mode=WEEKLY_MODE_TEMPLATE[weekday];return mode==='mix'||mode==='calisthenics'?`${schedule.calisthenicsTime} · Run + Cali`:mode==='gym'?`${schedule.gymTime} · Gym`:`${schedule.wakeTime} · Recovery day`}
  function renderOnboarding(profile,settings){
    const draft=state.onboardingDraft||{},step=profile.onboardingStatus==='ready'?4:(state.onboardingStep||1),s=settings.schedule,e=settings.equipment;

  function collectOnboardingStep(step){const d={...(state.onboardingDraft||{})};if(step===1){d.weight=Number(qs('#obWeight')?.value);d.goal=Number(qs('#obGoal')?.value);if(!Number.isFinite(d.weight)||d.weight<25||d.weight>350||!Number.isFinite(d.goal)||d.goal<=d.weight||d.goal>350)throw Error('Enter a valid weight and a goal above it.')}if(step===2){d.wake=qs('#obWake')?.value;d.morning=qs('#obMorning')?.value;d.gym=qs('#obGym')?.value;if(![d.wake,d.morning,d.gym].every(onboardingClock)||minutesOf(d.morning)<=minutesOf(d.wake)||minutesOf(d.gym)<=minutesOf(d.morning))throw Error('Set wake, morning training and gym in that order.')}if(step===3){d.equipment=Object.fromEntries(['pullupBar','bands','dipBars','dumbbells','cable','machines'].map(k=>[k,!!qs(`#ob-${k}`)?.checked]));d.foods=(qs('#obFoods')?.value||'').trim();if(!d.foods)throw Error('Add at least one common food.')}state.onboardingDraft=d;return d}
  async function saveOnboarding(){const d=collectOnboardingStep(3),profile=await get('profile',PROFILE_ID),settings=await appSettings(),schedule={...settings.schedule,wakeTime:d.wake,calisthenicsTime:d.morning,gymTime:d.gym,morningFuelTime:clockFromMinutes(minutesOf(d.morning)-20),breakfastTime:clockFromMinutes(minutesOf(d.morning)+75),preGymTime:clockFromMinutes(minutesOf(d.gym)-90),postGymTime:clockFromMinutes(minutesOf(d.gym)+90)};await mutate('profile',{...profile,startWeightKg:d.weight,goalWeightKg:d.goal,onboardingStatus:'needed',autopilotStartDate:profile.autopilotStartDate||dateKey()});await saveSettings({schedule,equipment:d.equipment,foodPreferences:{...settings.foodPreferences,favorites:d.foods}});await autoNutritionTarget();await generateWeeklyAutopilot(true);await ensureAutopilotDailyPlan();await autoCoachIfDue();await mutate('profile',{...(await get('profile',PROFILE_ID)),onboardingStatus:'ready'});state.onboardingStep=4}
  async function finishOnboarding(){const p=await get('profile',PROFILE_ID);await mutate('profile',{...p,onboardingStatus:'complete',onboardingCompletedAt:now()});state.onboardingDraft=null;state.onboardingStep=null;await dataIntegrityCheck();notifyScheduleChanged()}

  function bind(){qsa('[data-action]').forEach(el=>el.addEventListener('click',async()=>{const a=el.dataset.action;let undoPrepared=false,priorUndo=null;try{if(UNDO_ACTIONS.has(a)){priorUndo=await metaGet('reliability.undo');undoPrepared=await prepareUndo(a,el);}

      else if(a==='choose-mode'){await generateDailyPlan(el.dataset.mode);state.exception=false;toast('Today’s plan is ready.');render()}else if(a==='change-mode'||a==='open-mode-chooser'){state.dayModeChooser=true;render()}else if(a==='cancel-day-mode'){state.dayModeChooser=false;render()}else if(a==='apply-day-mode'){await applyDailyModeOverride(el.dataset.mode);state.dayModeChooser=false;toast('Today’s training changed. Weekly plan kept.');render()}else if(a==='activity-done'){await toggleDailyActivity();render()}else if(a==='today-weight'){await logWeight(Number(qs('#todayWeight').value));render()}else if(a==='focus-weight'){setTab('Eat')}else if(a==='meal-done'){await toggleMealDone(el.dataset.meal);state.mealExceptionId=null;render()}else if(a==='meal-swap'){await swapMeal(el.dataset.meal);render()}else if(a==='meal-cerelac'){await chooseCerelac(el.dataset.meal);render()}else if(a==='meal-exception'){state.mealExceptionId=state.mealExceptionId===el.dataset.meal?null:el.dataset.meal;setTab('Eat');render()}else if(a==='meal-fraction'){await setMealCompletion(el.dataset.meal,Number(el.dataset.fraction));state.mealExceptionId=null;toast('Remaining calories redistributed.');render()}else if(a==='meal-unavailable'){await markMealUnavailable(el.dataset.meal);state.mealExceptionId=null;toast('Meal swapped and remembered.');render()}else if(a==='start-daily-workout'){await startDailyWorkout(el.dataset.block,el.dataset.duration||'full');state.tab='Workout';state.exception=false;state.exceptionReason=null;state.showForm=false;render()}else if(a==='skip-daily-block'){await skipDailyBlock(el.dataset.block,'Time-aware skip to avoid crowding the later session.');toast('Morning block skipped to protect the rest of the day.');render()}else if(a==='reschedule-block'){const t=await rescheduleDailyBlock(el.dataset.block,el.dataset.time);toast(`Moved to ${t}.`);render()}else if(a==='done-prescribed-set'){await logPrescribedSet(true);state.exception=false;state.exceptionReason=null;state.runActual=false;render()}else if(a==='show-run-actual'){state.runActual=!state.runActual;render()}else if(a==='log-run-actual'){await logPrescribedSet(true,{distanceKm:Number(qs('#runActualDistance')?.value||0),minutes:Number(qs('#runActualMinutes')?.value||0),runMeasured:true});state.runActual=false;state.exception=false;state.exceptionReason=null;render()}else if(a==='show-exception'){state.exception=!state.exception;if(!state.exception)state.exceptionReason=null;render()}else if(a==='select-exception-reason'){state.exceptionReason=el.dataset.reason||null;render()}else if(a==='log-exception-set'){const s=await activeWorkout(),wx=s&&currentExercise(s),p=wx?.prescription||{},body=p.loadIncrementMode==='bodyweight',metric=p.metricType||'reps';const base={failureReason:state.exceptionReason||'other'},actual=metric==='run'?{...base,distanceKm:Number(qs('#actualDistance')?.value||0),minutes:Number(qs('#actualMinutes')?.value||0)}:metric==='time'?{...base,seconds:Number(qs('#actualSeconds')?.value||0)}:{...base,loadKg:body?0:Number(qs('#actualLoad')?.value||0),reps:Number(qs('#actualReps')?.value||0)};await logPrescribedSet(false,actual);state.exception=false;state.exceptionReason=null;render()}else if(a==='quick-exception'){const msg=await handleWorkoutException(el.dataset.kind);state.exception=false;state.exceptionReason=null;toast(msg);render()}
